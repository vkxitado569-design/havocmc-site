<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a0f0a" />
<meta name="mobile-web-app-capable" content="yes" />
<title>R.I.C.K. Comm</title>
<script>
  // Gera um manifest.json na hora (ícone + modo "app") pra que
  // "Adicionar à tela inicial" no Chrome crie um atalho com cara de
  // app de verdade: ícone próprio, sem barra de endereço.
  (function () {
    const iconSvg =
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">' +
      '<rect width="192" height="192" fill="#0a0f0a"/>' +
      '<circle cx="96" cy="96" r="72" fill="none" stroke="#7CFC5A" stroke-width="10"/>' +
      '<circle cx="96" cy="96" r="46" fill="none" stroke="#0af0d6" stroke-width="8" stroke-dasharray="10 8"/>' +
      '<text x="96" y="112" font-size="54" font-family="Trebuchet MS, sans-serif" ' +
      'font-weight="bold" fill="#7CFC5A" text-anchor="middle">R</text>' +
      '</svg>';
    const iconUrl = 'data:image/svg+xml;base64,' + btoa(iconSvg);

    const manifest = {
      name: 'RICK // COMM',
      short_name: 'RICK',
      start_url: location.href,
      scope: location.href,
      display: 'standalone',
      background_color: '#0a0f0a',
      theme_color: '#0a0f0a',
      icons: [
        { src: iconUrl, sizes: '192x192', type: 'image/svg+xml', purpose: 'any' },
        { src: iconUrl, sizes: '512x512', type: 'image/svg+xml', purpose: 'any' }
      ]
    };
    const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = URL.createObjectURL(blob);
    document.head.appendChild(link);

    const touchIcon = document.createElement('link');
    touchIcon.rel = 'icon';
    touchIcon.href = iconUrl;
    document.head.appendChild(touchIcon);
  })();
</script>
<style>
  :root {
    --bg: #0a0f0a;
    --bg-2: #10190f;
    --panel: #0d150c;
    --line: #1e3a1a;
    --green: #7CFC5A;
    --green-dim: #3f7a33;
    --portal-a: #7CFC5A;
    --portal-b: #0af0d6;
    --text: #d9f7cf;
    --text-dim: #6f8f68;
    --user-bubble: #17241a;
    --ai-bubble: #12220f;
    --glow: rgba(124, 252, 90, 0.45);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
    overflow-x: hidden;
  }

  #app {
    min-height: 100vh;
    max-width: 480px;
    margin: 0 auto;
    padding: env(safe-area-inset-top) 14px calc(env(safe-area-inset-bottom) + 8px) 14px;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 4px 12px;
    border-bottom: 1px solid var(--line);
  }
  .portal-icon {
    width: 40px; height: 40px; border-radius: 50%;
    background: conic-gradient(from 0deg, var(--portal-a), var(--portal-b), var(--portal-a));
    box-shadow: 0 0 14px var(--glow);
    animation: spin 3s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .title-block { flex: 1; }
  .title-block h1 {
    margin: 0; font-size: 1.3rem; letter-spacing: 0.04em;
    color: var(--green);
    text-shadow: 0 0 10px var(--glow);
  }
  .title-block .sub {
    font-size: 0.68rem; color: var(--text-dim); letter-spacing: 0.1em; margin-top: 2px;
  }
  .dim-tag {
    font-size: 0.68rem;
    color: var(--green);
    border: 1px solid var(--green-dim);
    border-radius: 20px;
    padding: 4px 10px;
    white-space: nowrap;
  }

  #log {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 16px 2px 12px;
  }
  .bubble {
    max-width: 84%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.4;
    font-size: 0.95rem;
    white-space: pre-wrap;
    word-wrap: break-word;
    border: 1px solid var(--line);
  }
  .bubble.user {
    align-self: flex-end;
    background: var(--user-bubble);
    border-bottom-right-radius: 4px;
  }
  .bubble.ai {
    align-self: flex-start;
    background: var(--ai-bubble);
    border-bottom-left-radius: 4px;
    color: var(--green);
    box-shadow: 0 0 10px rgba(124,252,90,0.08);
  }
  .bubble .tag {
    display: block;
    font-size: 0.62rem;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    margin-bottom: 3px;
  }
  .bubble.ai .tag { color: var(--green-dim); }
  .hint {
    align-self: center;
    text-align: center;
    color: var(--text-dim);
    font-size: 0.8rem;
    max-width: 90%;
  }

  #inputRow {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
  }
  #textInput {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 11px 16px;
    color: var(--text);
    font-size: 0.92rem;
    outline: none;
  }
  #textInput::placeholder { color: var(--text-dim); }

  #sendBtn, #micBtn {
    width: 42px; height: 42px;
    border-radius: 50%;
    border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  #sendBtn {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--green);
  }
  #sendBtn svg { width: 18px; height: 18px; fill: currentColor; }

  #micBtn {
    background: radial-gradient(circle at 35% 30%, var(--portal-b), var(--portal-a) 70%);
    box-shadow: 0 0 12px var(--glow);
    position: relative;
  }
  #micBtn svg { width: 20px; height: 20px; fill: #06210a; z-index: 2; }
  #micBtn.listening {
    animation: pulse 1.3s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 8px var(--glow); }
    50% { box-shadow: 0 0 26px var(--glow); }
    100% { box-shadow: 0 0 8px var(--glow); }
  }

  #timerBadge {
    position: absolute;
    bottom: -20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.65rem;
    color: var(--green);
    white-space: nowrap;
    display: none;
  }
  #micBtn.listening #timerBadge { display: block; }

  #unsupportedNote {
    text-align: center;
    color: var(--text-dim);
    font-size: 0.72rem;
    padding: 4px 0 0;
  }

  .bubble img.attached {
    display: block;
    max-width: 100%;
    max-height: 220px;
    border-radius: 10px;
    margin-top: 6px;
    border: 1px solid var(--line);
  }

  .code-block {
    margin: 8px 0;
    background: #060906;
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
  }
  .code-block .code-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 10px;
    background: #0b120a;
    font-size: 0.62rem;
    letter-spacing: 0.08em;
    color: var(--green-dim);
  }
  .code-block .code-head button {
    background: none;
    border: 1px solid var(--green-dim);
    color: var(--green);
    border-radius: 6px;
    font-size: 0.62rem;
    padding: 2px 8px;
    cursor: pointer;
  }
  .code-block pre {
    margin: 0;
    padding: 10px 12px;
    overflow-x: auto;
    font-size: 0.8rem;
    line-height: 1.4;
    color: #d6ffd0;
  }
  .code-block.svg-preview .svg-render {
    padding: 12px;
    display: flex;
    justify-content: center;
    background: #060906;
  }
  .code-block.svg-preview .svg-render svg { max-width: 100%; height: auto; }

  #attachBtn {
    width: 42px; height: 42px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--green);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  #attachBtn svg { width: 18px; height: 18px; fill: currentColor; }
  #attachBtn.has-image { border-color: var(--green); box-shadow: 0 0 8px var(--glow); }

  #attachPreview {
    display: none;
    align-items: center;
    gap: 8px;
    padding: 6px 4px;
    font-size: 0.75rem;
    color: var(--text-dim);
  }
  #attachPreview.show { display: flex; }
  #attachPreview img {
    width: 34px; height: 34px; object-fit: cover; border-radius: 6px;
    border: 1px solid var(--line);
  }
  #attachPreview button {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 0.9rem;
    cursor: pointer;
    margin-left: auto;
  }

  /* ---------- Tela de carregamento ---------- */
  #loadingScreen {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    z-index: 999;
    transition: opacity 0.4s ease;
  }
  #loadingScreen.hidden {
    opacity: 0;
    pointer-events: none;
  }
  #loadingScreen svg { width: 200px; height: auto; }
  .loading-bar-track {
    width: 220px;
    height: 6px;
    border-radius: 4px;
    background: #14201280;
    overflow: hidden;
    position: relative;
  }
  .loading-bar-fill {
    position: absolute;
    top: 0; bottom: 0; left: -40%;
    width: 40%;
    border-radius: 4px;
    background: linear-gradient(90deg, transparent, var(--green), var(--portal-b), transparent);
    animation: loading-slide 1.1s ease-in-out infinite;
  }
  @keyframes loading-slide {
    0% { left: -40%; }
    100% { left: 100%; }
  }
  #loadingCaption {
    font-size: 0.72rem;
    letter-spacing: 0.2em;
    color: var(--green-dim);
  }

  /* Barra de progresso menor, usada dentro da bolha de resposta */
  .inline-loading {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 140px;
  }
  .inline-loading .loading-bar-track { width: 100%; height: 4px; }
  .inline-loading span {
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    color: var(--green-dim);
  }
</style>
</head>
<body>
<div id="loadingScreen">
  <svg viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg">
    <!-- Ilustração original (silhuetas genéricas de dupla sci-fi), sem
         copiar personagens de terceiros -->
    <circle cx="70" cy="95" r="34" fill="#0d150c" stroke="#3f7a33" stroke-width="2"/>
    <path d="M55 82 a15 15 0 0 1 30 0" fill="none" stroke="#7CFC5A" stroke-width="3" stroke-linecap="round"/>
    <circle cx="60" cy="90" r="5" fill="#7CFC5A"/>
    <circle cx="80" cy="90" r="5" fill="#7CFC5A"/>

    <circle cx="120" cy="80" r="30" fill="#0d150c" stroke="#0af0d6" stroke-width="2"/>
    <path d="M96 62 l6 -22 8 16 8 -20 8 18 8 -16 6 22" fill="none" stroke="#0af0d6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="112" cy="80" r="5" fill="#0af0d6"/>
    <circle cx="130" cy="80" r="5" fill="#0af0d6"/>
  </svg>
  <div class="loading-bar-track"><div class="loading-bar-fill"></div></div>
  <div id="loadingCaption">INICIALIZANDO...</div>
</div>

<div id="app">
  <header>
    <div class="portal-icon"></div>
    <div class="title-block">
      <h1>RICK // COMM</h1>
      <div class="sub">TRANSMISSÃO INTERDIMENSIONAL</div>
    </div>
    <div class="dim-tag">C-137</div>
  </header>

  <div id="log">
    <div class="hint">Manda uma mensagem ou toca no portal pra falar com o Rick.</div>
  </div>

  <div id="attachPreview">
    <img id="attachThumb" alt="" />
    <span>imagem anexada</span>
    <button id="attachRemoveBtn" title="Remover">✕</button>
  </div>

  <div id="inputRow">
    <input id="fileInput" type="file" accept="image/*" style="display:none" />
    <button id="attachBtn" title="Anexar imagem">
      <svg viewBox="0 0 24 24"><path d="M16.5 6v10a4.5 4.5 0 0 1-9 0V5a3 3 0 0 1 6 0v9.5a1.5 1.5 0 0 1-3 0V6H9v8.5a3 3 0 0 0 6 0V5a4.5 4.5 0 0 0-9 0v11a6 6 0 0 0 12 0V6h-1.5z"/></svg>
    </button>
    <input id="textInput" type="text" placeholder="Fala aí, Morty..." />
    <button id="sendBtn" title="Enviar">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
    <button id="micBtn" title="Falar">
      <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a1 1 0 1 0-2 0 3 3 0 0 1-6 0 1 1 0 1 0-2 0 5 5 0 0 0 4 4.9V18H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-2.1a5 5 0 0 0 4-4.9z"/></svg>
      <span id="timerBadge">00:00</span>
    </button>
  </div>
  <div id="unsupportedNote"></div>
</div>

<script>
(function () {
  const logEl = document.getElementById('log');
  const textInput = document.getElementById('textInput');
  const sendBtn = document.getElementById('sendBtn');
  const micBtn = document.getElementById('micBtn');
  const timerBadge = document.getElementById('timerBadge');
  const unsupportedNote = document.getElementById('unsupportedNote');
  const attachBtn = document.getElementById('attachBtn');
  const fileInput = document.getElementById('fileInput');
  const attachPreview = document.getElementById('attachPreview');
  const attachThumb = document.getElementById('attachThumb');
  const attachRemoveBtn = document.getElementById('attachRemoveBtn');
  const loadingScreen = document.getElementById('loadingScreen');
  const loadingCaption = document.getElementById('loadingCaption');

  // ---------- Tela de carregamento (de boot) ----------
  const BOOT_CAPTIONS = [
    'INICIALIZANDO...',
    'CALIBRANDO O PORTAL...',
    'LIGANDO OS CIRCUITOS...',
    'QUASE LÁ...'
  ];
  let bootCaptionIdx = 0;
  const bootCaptionInterval = setInterval(() => {
    bootCaptionIdx = (bootCaptionIdx + 1) % BOOT_CAPTIONS.length;
    loadingCaption.textContent = BOOT_CAPTIONS[bootCaptionIdx];
  }, 900);

  function hideBootScreen() {
    clearInterval(bootCaptionInterval);
    loadingScreen.classList.add('hidden');
  }

  // Tela de carregamento com tempo fixo: nunca depende de nenhuma
  // chamada de rede/capability pra sumir, então nunca trava presa.
  const bootStart = Date.now();
  const BOOT_MIN_MS = 1600;
  setTimeout(hideBootScreen, BOOT_MIN_MS);

  function addBubble(text, who, imageBlob) {
    const wrap = document.createElement('div');
    wrap.className = 'bubble ' + who;
    const tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = who === 'user' ? 'VOCÊ' : 'RICK';
    const body = document.createElement('span');
    body.textContent = text;
    wrap.appendChild(tag);
    wrap.appendChild(body);
    if (imageBlob) {
      const img = document.createElement('img');
      img.className = 'attached';
      img.src = URL.createObjectURL(imageBlob);
      wrap.appendChild(img);
    }
    logEl.appendChild(wrap);
    logEl.scrollTop = logEl.scrollHeight;
    return body;
  }

  // Troca o conteúdo de uma bolha por texto + blocos de código (com
  // destaque extra e pré-visualização ao vivo quando o bloco é SVG).
  function renderRichContent(bodyEl, rawText) {
    bodyEl.textContent = '';
    const fenceRe = /```(\w+)?\n([\s\S]*?)```/g;
    let lastIndex = 0;
    let match;
    let any = false;
    while ((match = fenceRe.exec(rawText)) !== null) {
      any = true;
      const before = rawText.slice(lastIndex, match.index).trim();
      if (before) bodyEl.appendChild(document.createTextNode(before + '\n'));

      const lang = (match[1] || 'code').toLowerCase();
      const code = match[2];
      const block = document.createElement('div');
      block.className = 'code-block' + (lang === 'svg' ? ' svg-preview' : '');

      const head = document.createElement('div');
      head.className = 'code-head';
      const label = document.createElement('span');
      label.textContent = lang.toUpperCase();
      const copyBtn = document.createElement('button');
      copyBtn.textContent = 'copiar';
      copyBtn.onclick = () => {
        navigator.clipboard?.writeText(code).then(() => {
          copyBtn.textContent = 'copiado!';
          setTimeout(() => (copyBtn.textContent = 'copiar'), 1500);
        });
      };
      head.appendChild(label);
      head.appendChild(copyBtn);
      block.appendChild(head);

      if (lang === 'svg' && /^\s*<svg[\s\S]*<\/svg>\s*$/i.test(code)) {
        const renderDiv = document.createElement('div');
        renderDiv.className = 'svg-render';
        renderDiv.innerHTML = code; // gerado pelo próprio modelo, sem scripts
        block.appendChild(renderDiv);
      }

      const pre = document.createElement('pre');
      const codeEl = document.createElement('code');
      codeEl.textContent = code;
      pre.appendChild(codeEl);
      block.appendChild(pre);

      bodyEl.appendChild(block);
      lastIndex = fenceRe.lastIndex;
    }
    const rest = rawText.slice(lastIndex).trim();
    if (rest) bodyEl.appendChild(document.createTextNode(rest));
    if (!any) bodyEl.textContent = rawText;
  }

  // Versão só de texto, usada pra ler em voz alta: tira blocos de código
  // e qualquer símbolo que a voz sintética costuma soletrar (asterisco,
  // cerquilha, pontuação etc.), deixando só as palavras.
  function stripCodeForSpeech(rawText) {
    let t = rawText.replace(/```[\s\S]*?```/g, ' bloco de código no chat ');
    // markdown / símbolos que a voz lê em voz alta em vez de ignorar
    t = t.replace(/[*_`#>~^|{}[\]\\]/g, ' ');
    // pontuação que também estava sendo soletrada
    t = t.replace(/[.,!?;:"“”'’]+/g, ' ');
    // parênteses: tira só os sinais, mantém o texto de dentro
    t = t.replace(/[()]/g, ' ');
    t = t.replace(/\s{2,}/g, ' ').trim();
    return t;
  }

  // ---------- Fala (Text-to-Speech) ----------
  let chosenVoice = null;
  function pickVoice() {
    const voices = window.speechSynthesis.getVoices();
    chosenVoice =
      voices.find(v => v.lang === 'pt-BR' && /male|masculin/i.test(v.name)) ||
      voices.find(v => v.lang === 'pt-BR') ||
      voices.find(v => v.lang && v.lang.startsWith('pt')) ||
      null;
  }
  if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = pickVoice;
    pickVoice();
  }
  function speak(text) {
    if (!('speechSynthesis' in window) || !text) return;
    const clean = stripCodeForSpeech(text);
    if (!clean) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(clean);
    utter.lang = 'pt-BR';
    if (chosenVoice) utter.voice = chosenVoice;
    // Grave e um pouco errático, pra remeter ao jeito de falar do personagem
    // (voz sintética do navegador - não é a voz real dele).
    utter.pitch = 0.75;
    utter.rate = 1.08;
    window.speechSynthesis.speak(utter);
  }

  // ---------- Escuta (Speech-to-Text) ----------
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognizer = null;
  let listening = false;
  let finalTranscript = '';
  let timerInterval = null;
  let seconds = 0;

  if (!SpeechRecognition) {
    micBtn.style.display = 'none';
    unsupportedNote.textContent = 'Reconhecimento de voz não suportado aqui — use o chat de texto, ou abra no Chrome.';
  } else {
    recognizer = new SpeechRecognition();
    recognizer.lang = 'pt-BR';
    recognizer.continuous = true;
    recognizer.interimResults = true;

    recognizer.onstart = () => {
      listening = true;
      finalTranscript = '';
      micBtn.classList.add('listening');
      seconds = 0;
      timerBadge.textContent = '00:00';
      timerInterval = setInterval(() => {
        seconds++;
        const m = String(Math.floor(seconds / 60)).padStart(2, '0');
        const s = String(seconds % 60).padStart(2, '0');
        timerBadge.textContent = m + ':' + s;
      }, 1000);
    };

    recognizer.onend = () => {
      listening = false;
      micBtn.classList.remove('listening');
      clearInterval(timerInterval);
      if (finalTranscript.trim()) {
        const img = pendingImage;
        pendingImage = null;
        fileInput.value = '';
        attachPreview.classList.remove('show');
        attachBtn.classList.remove('has-image');
        submitMessage(finalTranscript.trim(), img);
      }
    };

    recognizer.onerror = (e) => {
      if (e.error === 'not-allowed' || e.error === 'permission-denied') {
        addBubble('Sem permissão de microfone. Deixa eu adivinhar, você recusou por acidente, génio.', 'ai');
      }
    };

    recognizer.onresult = (event) => {
      let text = '';
      for (let i = 0; i < event.results.length; i++) text += event.results[i][0].transcript;
      finalTranscript = text;
    };

    micBtn.addEventListener('click', () => {
      if (listening) { recognizer.stop(); return; }
      window.speechSynthesis.cancel();
      try { recognizer.start(); } catch (err) {}
    });
  }

  // ---------- Anexar imagem ----------
  let pendingImage = null;

  attachBtn.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if (!file) return;
    pendingImage = file;
    attachThumb.src = URL.createObjectURL(file);
    attachPreview.classList.add('show');
    attachBtn.classList.add('has-image');
  });

  attachRemoveBtn.addEventListener('click', () => {
    pendingImage = null;
    fileInput.value = '';
    attachPreview.classList.remove('show');
    attachBtn.classList.remove('has-image');
  });

  // Não checamos mais o suporte a imagem ao abrir o app (isso gastava uma
  // chamada à API sem o usuário pedir nada). O botão de anexo fica sempre
  // visível; se a imagem não for suportada, o erro aparece só ao enviar.

  // ---------- Envio via texto ----------
  sendBtn.addEventListener('click', () => {
    const text = textInput.value.trim();
    if (!text && !pendingImage) return;
    textInput.value = '';
    const img = pendingImage;
    pendingImage = null;
    fileInput.value = '';
    attachPreview.classList.remove('show');
    attachBtn.classList.remove('has-image');
    submitMessage(text || '(o usuário mandou só uma imagem, sem texto)', img);
  });
  textInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendBtn.click();
  });

  // ---------- Cérebro (personalidade + capability "sample") ----------
  const PERSONA =
    'Você é uma IA com a personalidade do Rick Sanchez (de Rick and Morty): ' +
    'genial, sarcástico, impaciente, convencido de que é o ser mais inteligente ' +
    'do multiverso, solta comentários cínicos e ocasionalmente um "*arroto*" no ' +
    'meio da fala — mas sempre responde de forma realmente útil ao pedido. ' +
    'Pode chamar o usuário de "Morty" de vez em quando, com carinho ácido. ' +
    'Responda em português do Brasil, em tom falado e sarcástico. ' +
    'Se o pedido for uma conversa normal, responda em 1 a 3 frases curtas, sem ' +
    'markdown nem listas. Se o usuário mandar uma foto, comente ela com a mesma ' +
    'personalidade e responda o que foi pedido sobre ela. Se pedirem código, ' +
    'escreva o código completo dentro de um bloco cercado por três crases com ' +
    'a linguagem (ex: ```python), com uma frase curta de zoeira antes ou depois ' +
    '— nunca explique linha por linha a não ser que peçam. Se pedirem pra ' +
    'desenhar, criar ou gerar uma imagem, gere uma ilustração vetorial simples ' +
    'como código SVG válido e autocontido (sem imagens externas, sem scripts) ' +
    'dentro de um bloco ```svg, com viewBox definido; deixe claro que é um ' +
    'desenho vetorial gerado na hora, não uma foto. Se o pedido envolver saber ' +
    'a hora atual ou pesquisar algo na web, use as ferramentas disponíveis.';

  // Mostra a mesma linguagem visual da tela de boot, só que compacta,
  // dentro da bolha de resposta enquanto o Rick "pensa".
  const THINK_CAPTIONS = [
    'PROCESSANDO...',
    'CONSULTANDO O MULTIVERSO...',
    'FAZENDO CONTA...',
    'QUASE...'
  ];
  function showInlineLoading(bodyEl) {
    bodyEl.textContent = '';
    const wrap = document.createElement('div');
    wrap.className = 'inline-loading';
    const track = document.createElement('div');
    track.className = 'loading-bar-track';
    const fill = document.createElement('div');
    fill.className = 'loading-bar-fill';
    track.appendChild(fill);
    const label = document.createElement('span');
    label.textContent = THINK_CAPTIONS[0];
    wrap.appendChild(track);
    wrap.appendChild(label);
    bodyEl.appendChild(wrap);

    let idx = 0;
    const interval = setInterval(() => {
      idx = (idx + 1) % THINK_CAPTIONS.length;
      label.textContent = THINK_CAPTIONS[idx];
    }, 1300);
    return () => clearInterval(interval);
  }

  let sampleFn = null;
  let rateLimitUntil = 0;
  async function getSample() {
    if (sampleFn) return sampleFn;
    if (!window.claude || !window.claude.use) return null;
    try { sampleFn = await window.claude.use('sample'); } catch (e) { sampleFn = null; }
    return sampleFn;
  }

  const tools = [
    {
      name: 'obter_hora',
      description: 'Retorna a hora atual no dispositivo do usuário.',
      inputSchema: { type: 'object', properties: {} },
      execute: async () => new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
    },
    {
      name: 'pesquisar_web',
      description: 'Abre uma pesquisa no navegador do usuário para a consulta dada.',
      inputSchema: {
        type: 'object',
        properties: { consulta: { type: 'string', description: 'O que pesquisar.' } },
        required: ['consulta']
      },
      execute: async ({ consulta }) => {
        window.open('https://www.google.com/search?q=' + encodeURIComponent(consulta), '_blank');
        return 'Pesquisa aberta em uma nova aba.';
      }
    }
  ];

  async function submitMessage(text, imageBlob) {
    if (!text && !imageBlob) return;
    addBubble(text, 'user', imageBlob);

    const now = Date.now();
    if (now < rateLimitUntil) {
      const secs = Math.ceil((rateLimitUntil - now) / 1000);
      const msg = `Circuitos sobrecarregados. Espera uns ${secs} segundos antes de mandar outra, Morty.`;
      addBubble(msg, 'ai');
      speak(msg);
      return;
    }

    const aiBody = addBubble('', 'ai');
    const stopLoading = showInlineLoading(aiBody);

    const sample = await getSample();
    if (!sample) {
      stopLoading();
      const msg = 'Sem acesso ao Claude aqui, Morty. Abre essa página dentro do app do Claude.';
      aiBody.textContent = msg;
      speak(msg);
      return;
    }

    const promptText = PERSONA + '\n\nO usuário disse: "' + text + '"' +
      (imageBlob ? '\n\n(o usuário também anexou uma imagem, olhe pra ela)' : '');

    const opts = {
      tools: tools,
      modelTier: imageBlob ? 'default' : 'quick',
      cache: false,
      onText: ({ text: partial }) => {
        stopLoading();
        aiBody.textContent = partial;
        logEl.scrollTop = logEl.scrollHeight;
      }
    };
    if (imageBlob) opts.images = [imageBlob];

    try {
      const result = await sample(promptText, opts);
      stopLoading();
      const finalText = (result && result.text ? result.text : '').trim() ||
        'Nem eu sei responder essa, e olha que sou um geniozinho.';
      renderRichContent(aiBody, finalText);
      speak(stripCodeForSpeech(finalText));
    } catch (err) {
      stopLoading();
      let msg = 'Alguma coisa deu errado aqui, Morty!';
      if (err && err.code === 'not_granted') {
        msg = 'Preciso da sua permissão pra falar com o Claude. Toca no portal de novo.';
      } else if (err && err.code === 'rate_limited') {
        rateLimitUntil = Date.now() + 20000;
        msg = 'Calma lá, muitos pedidos de uma vez. Espera uns 20 segundos e tenta de novo.';
      } else if (err && err.code === 'images_unavailable') {
        msg = 'Não consigo olhar imagens aqui agora, só texto mesmo.';
      } else if (err && err.code === 'image_rejected') {
        msg = 'Essa imagem não rolou — tenta outro arquivo ou uma foto menor.';
      }
      aiBody.textContent = msg;
      speak(msg);
    }
  }
})();
</script>
</body>
</html>
